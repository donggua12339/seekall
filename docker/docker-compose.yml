services:
  seekall-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: seekall-api
    restart: unless-stopped
    networks:
      seekall-net:
        ipv4_address: 172.18.0.5  # 固定 IP（nginx 反代依赖）
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Docker 容器内 localhost 是自己，需用 service 名指向 mysql/meilisearch/redis
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      - REDIS_URL=redis://redis:6379
      - MEILISEARCH_URL=http://meilisearch:7700
    healthcheck:
      # API 实际用 APP_PORT=7301（不是 compose 写的 PORT=3000），用 node http 模块测健康
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:7301/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started

  seekall-docs-site:
    build:
      context: ../apps/docs-site
      dockerfile: Dockerfile
    container_name: seekall-docs-site
    restart: unless-stopped
    networks:
      seekall-net:
        ipv4_address: 172.18.0.6  # 固定 IP（nginx 反代依赖）
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  seekall-admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    container_name: seekall-admin
    restart: unless-stopped
    networks:
      seekall-net:
        ipv4_address: 172.18.0.7  # 固定 IP（nginx 反代 admin.seekall.winmelon.cn）
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  seekall-user-spa:
    build:
      context: ..
      dockerfile: apps/user-spa/Dockerfile
    container_name: seekall-user-spa
    restart: unless-stopped
    networks:
      seekall-net:
        ipv4_address: 172.18.0.9  # 固定 IP(172.18.0.8 被 dht-meilisearch v0.4.1 遗留占用)
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.0
    container_name: seekall-mysql
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 改用 docker 命名卷替代 bind mount（bind mount 在 lxd:docker 容器里权限问题反复）
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./backups/mysql:/backups
    ports:
      - '127.0.0.1:3306:3306'
    healthcheck:
      # LXD 嵌套容器下 CMD 形式 docker exec 会报 "container breakout detected"
      # 改用 CMD-SHELL，shell 启动时 cwd 默认是 /，绕过 breakout 检测
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - seekall-net

  redis:
    image: redis:7-alpine
    container_name: seekall-redis
    restart: unless-stopped
    # --stop-writes-on-bgsave-error no：LXD 嵌套容器下 RDB bgsave 偶发失败（fork 受限），
    #   默认配置会因此拒绝所有写命令导致登录等功能瘫痪。已开 AOF（appendonly yes）保证持久化，
    #   故关闭"bgsave 失败即停写"，避免 RDB 抖动影响写入。
    command: redis-server --appendonly yes --dir /data --maxmemory 256mb --maxmemory-policy allkeys-lru --stop-writes-on-bgsave-error no
    volumes:
      - ./redis/data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      # LXD 嵌套容器下 CMD 形式 docker exec 会报 "container breakout detected"
      # 改用 CMD-SHELL，shell 启动时 cwd 默认是 /，绕过 breakout 检测
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seekall-net

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: seekall-meilisearch
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meilisearch/data:/meili_data
    ports:
      - '127.0.0.1:7700:7700'
    networks:
      - seekall-net

networks:
  seekall-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1
    # 关键服务固定 IP（nginx 反代 + Prisma DATABASE_URL 都依赖这些地址）
    # 重启 / 重建容器 IP 不变，避免上游配置失效

volumes:
  mysql_data:
