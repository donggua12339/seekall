# SeekAll docs-site nginx 配置
# vitepress 静态站 + SPA fallback + 长缓存

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 隐藏 nginx 版本
    server_tokens off;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 静态资源长缓存（vitepress hash 文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback（vitepress cleanUrls）
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # 健康检查
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
