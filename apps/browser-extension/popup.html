<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>觅源 SeekAll</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      color: #1f2937;
    }
    .header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #fff;
      padding: 16px;
      text-align: center;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header p { font-size: 12px; opacity: 0.9; margin-top: 4px; }
    .search-box {
      padding: 16px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #6366f1; }
    .results {
      max-height: 400px;
      overflow-y: auto;
    }
    .result-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
      transition: background 0.2s;
    }
    .result-item:hover { background: #f9fafb; }
    .result-title {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .result-meta {
      display: flex;
      gap: 8px;
      font-size: 11px;
      color: #6b7280;
    }
    .result-meta .tag {
      background: #eef2ff;
      color: #4f46e5;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .loading {
      padding: 32px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }
    .empty {
      padding: 32px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }
    .footer {
      padding: 8px 16px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      font-size: 11px;
      color: #6b7280;
      text-align: center;
    }
    .footer a { color: #6366f1; text-decoration: none; }
    .password {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 觅源 SeekAll</h1>
    <p>觅寻全网资源，一站即达</p>
  </div>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="输入关键词搜索资源..."
      autofocus
    />
  </div>

  <div id="results" class="results">
    <div class="empty">输入关键词开始搜索</div>
  </div>

  <div class="footer">
    <a href="https://seekall.winmelon.cn" target="_blank">打开完整版 →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
